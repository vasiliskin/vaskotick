name: Dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable + installer
        run: node scripts/build.js

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaskoTick-dev-${{ github.run_number }}
          path: release/*.exe
          retention-days: 14
